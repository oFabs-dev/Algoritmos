<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX04</title>
</head>
<body>

    <!-- 4.  Rola a pizza?

Um grupo de amigos costuma se reunir na casa de um deles para comer pizza. Só que eles têm um trato de que o valor da pizza,
 quando dividido entre os amigos, não deve passar de 20,00 por amigo. Ajude-os criando um programa o qual: 

a) Pergunte o valor da pizza 

b) Pergunte a quantidade de amigos reunidos 

c) Ao clicar em "Rola a pizza?", calcule e exiba o valor que cada amigo vai pagar na pizza com uma frase na página como esta 
"Cada amigo vai pagar R$X pela pizza" 

d) Somente caso o valor por amigo passe de R$20,00, exiba também a frase "Deu ruim! Pizza muito cara!"

 -->

<span>Valor da pizza</span>
<input type="number" id="ipt_valor">

<span>Quantidades de amigos</span>
<input type="number" id="ipt_amigos">

<button onclick="exibir()">Rola a pizza?</button>

<div id="div_exibir"></div>


    
</body>
</html>


<script>

function exibir(){
let valor = Number(ipt_valor.value)
let amigos = Number(ipt_amigos.value)
let porPessoa = valor / amigos

if(porPessoa > 20){
    div_exibir.innerHTML = (`Cada amigo vai pagar R$${porPessoa.toFixed(2)} pela pizza <br>
    Deu ruim! Pizza muito cara!`)

}else{
    div_exibir.innerHTML = (`Cada amigo vai pagar R$${porPessoa.toFixed(2)} pela pizza`)
 
}

}


</script>
