    <!-- 19. Análise de economia 

Crie um programa o qual: 

a) Pergunte ao usuário qual sua meta de economia 

b) Pergunte ao usuário quanto tem guardado 

c) Ao clicar em "Analisar economia"... 

d) Caso a meta tenha sido alcançada ou ultrapassada, exibir, abaixo do botão,
 a frase Parabéns, meta alcançada!. Caso a meta tenha sido ultrapassada,
  exibir também a frase Meta ultrapassada em X (onde X é a diferença entre a economia e a meta) 

e) Caso a meta ainda não tenha sido alcançada, exibir, abaixo do botão, 
a frase Força! Ainda em busca da meta! Falta X (onde X é a diferença entre a meta e a economia)  -->


<span>Meta de economia</span>
<input type="text" id="ipt_eco">

<span>Valor Guardado</span>
<input type="text" id="ipt_valor_gua">  

<button onclick="exibir()">Analisar economia</button>

<div id="div_exibir"></div>

</body>
</html>

<script>

function exibir(){
let meta = Number(ipt_eco.value)
let valor  = Number(ipt_valor_gua.value)
let variante = meta - valor

if (meta == valor){

div_exibir.innerHTML =(`Parabéns, meta alcançada!`)
}

if (meta < valor){

div_exibir.innerHTML = (`Meta ultrapassada`)

}

if (meta > valor){

div_exibir.innerHTML = (`Força! Ainda em busca da meta!`)

}



}




</script>
