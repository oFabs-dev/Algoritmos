<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX03</title>
  </head>
  <body>
    <span>Temperatura</span>
    <input type="text" id="ipt_temp"/>

    <button onclick="exibir()">Analisar</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let temp = Number(ipt_temp.value);

    if (temp < 14) {
      div_exibir.innerHTML = `Congelante`;
    } else if (temp <= 21) {
      div_exibir.innerHTML = `Com Frio`;
    } else if (temp <= 24) {
      div_exibir.innerHTML = `Confortável`;
    } else if (temp <= 31) {
      div_exibir.innerHTML = `Com Calor `;
    } else {
      div_exibir.innerHTML = `Calor escaldante`;
    }
  }
</script>
