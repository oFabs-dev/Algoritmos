    <title>Document</title>
  </head>
  <body>
    <span>Como você esta se sentindo?(Feliz,Triste,Bravo,Supreso e Cansado)</span>

      div_exibir.innerHTML = `<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMpTxT5ilnax3HuJj-DPuMc1gQ8fq1IRWJ8I5PThdDXA&s=10" alt="">`;
    } else if (humor == "Bravo") {
      div_exibir.innerHTML = `<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTincTJKCvcko6AHjv9kUIGoJMfgjgR8twfhyhIRgCSzQ&s=10" alt="">`;
    } else if (humor == "Supreso") {
      div_exibir.innerHTML = `<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHZJhV6xFwA_vr3OuUkfNUf4QMeO7vuURjpZPqE94zSA&s=10" alt="">`;
