<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX07</title>
  </head>
  <body>
    <span>Quantos Pães Franceses ao dia?</span>
    <input type="text" id="ipt_pao" /> <br />

    <span>Quantos pacote de bolacha ao dia?</span>
    <input type="text" id="ipt_bolacha" /> <br />

    <span>Quantos copos de achocolatado ao dia?</span>
    <input type="text" id="ipt_achocolatado" /> <br />

    <button onclick="verificar()">Verificar calorias</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function verificar() {
    let pao = Number(ipt_pao.value) * 50;
    let bolacha = Number(ipt_bolacha.value) * 80;
    let choc = Number(ipt_achocolatado.value) * 70;
    let calorias = pao + bolacha + choc;

    if (calorias < 200) {
      div_exibir.innerHTML = `Parabéns, vai ficar em forma!`;
    } else if (calorias <= 400) {
      div_exibir.innerHTML = `Cuidado, vai ficar menos saudável !`;
    } else {
      div_exibir.innerHTML = `Alerta crítico de saúde !!!`;
    }
  }
</script>
