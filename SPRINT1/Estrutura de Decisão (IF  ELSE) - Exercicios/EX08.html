<body>

    <!-- 8. Cheque especial 

Criar um programa que auxilie o Banco XPTO a identificar quem entrou no cheque especial.  

a) Solicite o saldo da conta 

b) Solicite o valor do débito (ou seja, valor a tirar da conta) 

c) Ao clicar em "Analisar conta", calcule o novo saldo da conta e exiba a mensagem 
"O saldo atual da conta corrente é XX". Esta frase deverá estar em negrito e vermelho somente se o saldo for menor que zero. -->

<span>Saldo da conta</span>
<input type="number" id="ipt_saldo">

<span>Valor do débito</span>
<input type="number" id="ipt_debito">

<button onclick="exibir()">Analisar conta</button>

<div id="div_exibir"></div>

    
</body>
</html>

<script>


function exibir(){
let saldo = Number(ipt_saldo.value) 
let debito = Number(ipt_debito.value)
saldo -= debito

if(saldo < 0){

    div_exibir.innerHTML = (`<b style="color: red;">O saldo atual da conta corrente é ${saldo}</b>`)

}else{

    div_exibir.innerHTML = (`O saldo atual da conta corrente é ${saldo}`)
}


}


</script>
