<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX09</title>
  </head>
  <body>
    <!-- 9. Controle de peso no elevador

Crie um programa que controle o peso médio dentro de um elevador:  

a) Solicite a quantidade de homens que entraram no elevador 

b) Solicite a quantidade de mulheres que entraram no elevador 

c) Ao clicar em "Analisar peso", calcule o peso estimado sendo: homens x 80 somado com mulheres x 60 

d) Exiba na página a mensagem "Este elevador suporta 800 Kg e o peso estimado desta lotação é de XXXkg"  

e) Se o peso estimado for maior que 800, exibir também a mensagem "Será necessário que alguém desça para que o elevador se movimente" - na cor azul.  
 -->

    <span>Homens no elevador</span>
    <input type="text" id="ipt_homens" />

    <span>Mulheres no elevador</span>
    <input type="text" id="ipt_mulheres" />

    <button onclick="exibir()">Analisar peso</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let H = Number(ipt_homens.value);
    let M = Number(ipt_mulheres.value);
    let total = H * 80 + M * 60;

    div_exibir.innerHTML = `Este elevador suporta 800 Kg e o peso estimado desta lotação é de ${total}kg <br>`;

    if (total > 800) {
      div_exibir.innerHTML += `<span style="color: blue;">Será necessário que alguém desça para que o elevador se movimente</span>`;
    }
  }
</script>
