<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <!-- 7. Financiamento da Casa própria 

Crie um programa que auxilie um banco a identificar quem tem renda o suficiente para fazer o financiamento da casa própria.  

a) Solicite o valor da renda familiar 

b) Solicite o valor da prestação 

c) Ao clicar em "Verificar financiamento", exiba na página a mensagem "A prestação corresponde a XX% da renda familiar" 
(divida a prestação pela renda e multiplique por 100) 

d) Se o valor calculado acima for maior que 30%, exiba também a mensagem abaixo em negrito e em vermelho: 

    "Será necessário complementar a renda familiar"    -->


    
<span>Valor da renda familiar</span>
<input type="number" id="ipt_renda">

<span>Valor da prestação</span>
<input type="number" id="ipt_prestacao">   

<button onclick="exibir()">Verificar financiamento</button>

<div id="div_exibir"></div>

    
</body>
</html>

<script>

function exibir(){

let renda = Number(ipt_renda.value)
let prestacao = Number(ipt_prestacao.value)
let financiamento = (prestacao / renda) * 100


div_exibir.innerHTML = (`A prestação corresponde a ${financiamento}% da renda familiar<br>`)


if(financiamento > 30){

div_exibir.innerHTML += (`<b style="color: red;">Será necessário complementar a renda familiar</b>`)


}

}

</script>
