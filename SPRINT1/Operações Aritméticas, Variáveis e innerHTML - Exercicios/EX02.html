<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX02</title>
</head>
<body>


<input type="number" id="input_n1">

<input type="number" id="input_n2">

<button onclick="quociente()">Quociente</button>
<button onclick="resto()">Resto</button>
<button onclick="completo()">Completo</button>

<div id="div_exibir" style="font-size: xx-large;"></div>

</body>
</html>

<script>

function quociente(){
let n1 = Number(input_n1.value)
let n2 = Number(input_n2.value)
let resultado = n1 / n2

    div_exibir.innerHTML = (`A divisão de ${n1} por ${n2} é: ${resultado}`)
}

function resto(){
let n1 = Number(input_n1.value)
let n2 = Number(input_n2.value)
let resultado = n1 % n2

    div_exibir.innerHTML = (`O resto da divisão de ${n1} por ${n2} é: ${resultado}`)

}

function completo(){
let n1 = Number(input_n1.value)
let n2 = Number(input_n2.value)
let resto = n1 % n2
let divisao = n1 / n2

    div_exibir.innerHTML = (`A divisão de ${n1} por ${n2} é: ${divisao} e o resto da divisão é: ${resto}`)
}

</script>
