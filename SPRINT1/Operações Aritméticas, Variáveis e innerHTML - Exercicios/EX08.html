<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX08</title>
</head>
<body>


<span>Valor da passagem</span>
    <input type="number" id="input_Valorpass">   

<span>Quantidade de viagem no mês</span>
    <input type="number" id="input_qtdviagem">

<span>Trabalho até a casa (km)</span>
    <input type="number" id="input_TrabCasa">

<button onclick="exibir()">Calcular VT</button>

<div id="div_exibir"></div>


</body>
</html>

<script>

function exibir(){
let Valorpass = Number(input_Valorpass.value)
let qtdviagem = Number(input_qtdviagem.value)
let TrabCasa = Number(input_TrabCasa.value)
let gastoTrans = (qtdviagem * 0.9) * Valorpass
let gastoUber = (qtdviagem * 0.1) * (TrabCasa * 0.75 )
let Total = gastoTrans + gastoUber * 2

div_exibir.innerHTML = `Você vai gastar R$${Total} por mês com transporte.`


}

</script>
