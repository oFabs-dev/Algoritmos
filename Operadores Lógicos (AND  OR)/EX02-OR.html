<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 2. Processo Seletivo Mentes Brilhantes
No processo seletivo da faculdade Mentes Brilhantes,
 o aluno é aprovado se sua nota no ENEM foi a partir de 800 ou se ele fizer o vestibular interno 
 e tirar pelo menos 700. Crie um programa que será usado por essa instituição. 

a) Solicite a nota do ENEM do aluno 

b) Solicite a nota do vestibular interno do aluno 

c) Ao clicar em "Avaliação", deve ser exibido um alert com o texto "Parabéns! Aprovado", 
caso suas notas, segundo as regras, o aprovem 

d) Caso contrário, exiba um alert com a frase "Tente semestre que vem!"  -->

    <span>Nota Enem</span>
    <input type="text" id="ipt_enem" />

    <span>Nota vestibular interno</span>
    <input type="text" id="ipt_vestInte" />

    <button onclick="exibir()">Avaliação</button>
  </body>
</html>

<script>
  function exibir() {
    let enem = Number(ipt_enem.value);
    let interno = Number(ipt_vestInte.value);

    if (enem >= 800 || interno >= 700) {
      alert(`Parabéns! Aprovado`);
    } else {
      alert(`Tente semestre que vem!`);
    }
  }
</script>
