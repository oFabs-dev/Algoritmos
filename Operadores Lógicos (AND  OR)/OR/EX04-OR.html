<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 4. Análise de Parcelamento de Compra
Crie um programa que avalie a possibilidade de um pagamento da compra ser parcelado ou não. 

a) Pergunte o modo de pagamento dentre as seguintes opções: 

    Dinheiro  

    Cartão de débito  

    Cartão de crédito  

    Boleto 

b) Ao clicar num botão "Analisar compra", exiba uma dessa mensagens: 

   "Você terá que pagar a vista", somente se o pagamento for dinheiro ou débito  

   "Pagamento poderá ser parcelado", se o pagamento for crédito ou boleto 

  -->

    <span>Modo de pagamento</span>

    <select id="select_pagamento">
      <option>Dinheiro</option>
      <option>Cartão de débito</option>
      <option>Cartão de crédito</option>
      <option>Boleto</option>
    </select>

    <button onclick="exibir()">Analisar compra</button>
    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let pagamento = select_pagamento.value;

    if (pagamento == `Dinheiro` || pagamento == `Cartão de débito`) {
      div_exibir.innerHTML = `Você terá que pagar a vista`;
    } else {
      div_exibir.innerHTML = `Pagamento poderá ser parcelado`;
    }
  }
</script>
