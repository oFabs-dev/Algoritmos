<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width= , initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 9. Acesso à Academia 24 Horas
Uma academia libera o acesso à catraca se o aluno tiver o plano Premium, OU se o aluno tiver o plano Básico 
E estiver tentando entrar em um horário permitido (entre 6h e 22h), desde que, em qualquer um dos casos,
 o check-in biométrico tenha sido validado.

Crie um programa o qual:

a) Pergunte o plano do aluno, com um select ("Premium" ou "Básico")

b) Solicite a hora atual (0 a 23)

c) Pergunte, com um select ("Sim"/"Não"), se o check-in biométrico foi validado

d) Ao clicar em "Liberar catraca", exiba um alert com "Acesso liberado" ou "Acesso negado", conforme as regras acima -->

    <span>Qual seu plano</span>
    <select id="select_plano">
      <option disabled selected>Selecione uma opção</option>
      <option>Premium</option>
      <option>Básico</option>
    </select>
    <br />

    <span>Hora Atual</span>
    <input type="text" id="ipt_hora" />
    <br />

    <span>Check-in biométrico foi validado</span>
    <select id="select_biometria">
      <option disabled selected>Selecione uma opção</option>
      <option>Sim</option>
      <option>Não</option>
    </select>
    <br />

    <button onclick="liberar()">Liberar catraca</button>
  </body>
</html>

<script>
  function liberar() {
    let plano = select_plano.value;
    let hora = Number(ipt_hora.value);
    let biometria = select_biometria.value;

    if (
      (plano == "Básico" || plano == "Premium") &&
      hora >= 6 &&
      hora <= 22 &&
      biometria == "Sim"
    ) {
      alert(`Acesso liberado`);
    } else {
      alert(`Acesso negado`);
    }
  }
</script>
