<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 4. Acesso à Área VIP do Evento
Um evento libera a entrada na área VIP para pessoas com pelo menos 18 anos E 
(que tenham ingresso VIP OU que possuam um convite especial).

Crie um programa o qual:

a) Solicite a idade da pessoa

b) Pergunte, com um select ("Sim"/"Não"), se a pessoa tem ingresso VIP

c) Pergunte, com um select ("Sim"/"Não"), se a pessoa tem convite especial

d) Ao clicar em "Liberar acesso", exiba um alert com "Acesso liberado à área VIP" ou "Acesso negado", 
conforme a regra acima -->

    <span>Idade:</span>
    <input type="text" id="ipt_idade" />

    <span>ingresso VIP</span>
    <select id="select_vip">
      <option disabled selected>Selecione uma opção</option>
      <option>Sim</option>
      <option>Não</option>
    </select>

    <span>Convite especial</span>
    <select id="select_especial">
      <option disabled selected>Selecione uma opção</option>
      <option>Sim</option>
      <option>Não</option>
    </select>

    <button onclick="verificar()">Liberar acesso</button>
  </body>
</html>

<script>
  function verificar() {
    let idade = Number(ipt_idade.value);
    let vip = select_vip.value;
    let especial = select_especial.value;

    if (idade >= 18 && (vip == "Sim" || especial == "Sim")) {
      alert(`Acesso liberado à área VIP`);
    } else {
      alert(`Acesso negado`);
    }
  }
</script>
