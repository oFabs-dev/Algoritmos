<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 3. Simulador de Preço do Bilhete Único de São Paulo
Crie um pequeno simulador de preço de passagem de Bilhete Único de São Paulo num programa, o qual: 

a) Tenha uma caixa de seleção para indicar o tipo de passageiro, com os itens 

            Comum 
            Estudante 
            Idoso/PNE 

b) Tenha uma outra caixa de seleção, para indicar o tipo de passagem, com os itens 

            Passagem única 
            Passagem integração 

c) Ao clicar num botão "Simular preço", considere que o preço unitário de uma passagem única é R$4,40 e que a integração
 é R$5,90 para fazer os cálculos necessários para exibir uma frase como esta: 

            Valor da passagem escolhida: R$X,XX 

d) Considere ainda que um estudante tem 50% de desconto e idoso/PNE possuem gratuidade em qualquer tipo de passagem  -->

    <label for="select_passageiro">Tipo de passageiro</label>
    <select id="select_passageiro">
      <option disabled selected>Tipo de passageiro</option>
      <option>Comum</option>
      <option>Estudante</option>
      <option>Idoso/PNE</option>
    </select>

    <label for="select_passagem">Tipo de passagem</label>
    <select id="select_passagem">
      <option disabled selected>Tipo de passagem</option>
      <option>Passagem única</option>
      <option>Passagem integração</option>
    </select>

    <button onclick="exibir()">Simular Preço</button>

    <div id="div_exibir">Valor da passagem escolhida: R$0</div>
  </body>
</html>

<script>
  function exibir() {
    let uni = 4.4;
    let int = 5.9;
    let passageiro = select_passageiro.value;
    let passagem = select_passagem.value;

    if (passageiro == "Idoso/PNE") {
      div_exibir.innerHTML = `Valor da passagem escolhida: Gratuito`;
    } else if (passageiro == "Comum" && passagem == "Passagem única") {
      div_exibir.innerHTML = `Valor da passagem escolhida: R$${uni.toFixed(2)} `;
    } else if (passageiro == "Comum" && passagem == "Passagem integração") {
      div_exibir.innerHTML = `Valor da passagem escolhida: R$${int.toFixed(2)} `;
    } else if (passageiro == "Estudante" && passagem == "Passagem única") {
      div_exibir.innerHTML = `Valor da passagem escolhida: R$${(uni / 2).toFixed(2)} `;
    } else if (passageiro == "Estudante" && passagem == "Passagem integração") {
      div_exibir.innerHTML = `Valor da passagem escolhida: R$${(int / 2).toFixed(2)} `;
    }
  }
</script>
