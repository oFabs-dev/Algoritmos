<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 5. Avaliação do Clima: Está Agradável ou Desconfortável?
Crie um programa em que ajude a avaliar o clima de um ambiente, o qual: 

a) Solicite a temperatura 

b) Solicite a umidade do ar 

c) Ao clicar em 'Avaliar clima': 

      c.1) Caso a umidade for inválida, ou seja, menor que 0 ou maior que 100, exiba um alert "Valor de umidade inválido" 
      e limpe qualquer outro texto que exista na tela (item c.2) 
      c.2) Caso a umidade for válida, exiba uma dessas frases na própria página, abaixo do botão: 

            "Clima agradável", caso a temperatura for entre 22 e 23 e a umidade for menor que 60. 
            "Clima desconfortável", em caso contrário.   -->

    <label for="ipt_temperatura">Temperatura</label>
    <input type="text" id="ipt_temperatura" />

    <label for="ipt_umAr">Umidade do ar</label>
    <input type="text" id="ipt_umAr" />

    <button onclick="exibir()">Avaliar clima</button>
    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let temp = Number(ipt_temperatura.value);
    let umAr = Number(ipt_umAr.value);

    if (umAr < 0 || umAr > 100) {
      alert(`Valor de umidade inválido`);
      div_exibir.innerHTML = ` `;
    } else if (temp <= 23 && temp >= 22 && umAr < 60) {
      div_exibir.innerHTML = `Clima agradável`;
    } else {
      div_exibir.innerHTML = `Clima desconfortável`;
    }
  }
</script>
