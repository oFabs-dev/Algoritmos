 <!DOCTYPE html>
 <html lang="ptBR">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX01</title>
 </head>
 <body>

   
   <input type="number" id="input_n1">

   <input type="number" id="input_n2">

   <button onclick="somar()">SOMA</button>
   <button onclick="subtrair()">SUBTRAÇÃO</button>
   <button onclick="multiplicar()">MULTIPLICAÇÃO</button>
   <button onclick="dividir()">DIVISÃO</button>

   <div id="div_exibir" style="font-size: xx-large;"> 
    </div>

 </body>
 </html>

 <script>

function somar(){
let n1 = Number(input_n1.value)
let n2 = Number(input_n2.value)
let resultado = n1 + n2

div_exibir.innerHTML = ( `A soma entre ${n1} e ${n2} é ${resultado}`)

}

function subtrair(){
let n1 = Number(input_n1.value)
let n2 = Number(input_n2.value)
let resultado = n1 - n2

div_exibir.innerHTML = ( `A diferença entre ${n1} e ${n2} é ${resultado}`)

}

function multiplicar(){
let n1 = Number(input_n1.value)
let n2 = Number(input_n2.value)
let resultado = n1 * n2

div_exibir.innerHTML = ( `O produto entre ${n1} e ${n2} é ${resultado}`)

}


function dividir(){
let n1 = Number(input_n1.value)
let n2 = Number(input_n2.value)
let resultado = n1 / n2

div_exibir.innerHTML = ( `A razão entre ${n1} e ${n2} é ${resultado}`)

}



 </script>
