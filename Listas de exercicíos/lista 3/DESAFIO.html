<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="exibir()" style="font-size: xx-large;">incremetar</button>
    <div id="div_exibir"></div>
    
</body>

<script>

    let contangem = 0

function exibir(){

    contangem += 1

    div_exibir.innerHTML = div_exibir.innerHTML + `O NUMERO É ${contangem} <br>`
}


</script>
