<head>

</head>
<body>

    <span>Nome do filme</span>
    <input type="text" id="input_filme">

    <br>

    <span>Horário da sessão</span>

    <br>

    <button onclick="exibir()">Confirmar ingresso</button>

<script>
    function exibir(){
        alert('Ingresso confirmado para o filme ' +  input_filme.value  +' no horário ' +  input_horario.value)
    }

</script>
