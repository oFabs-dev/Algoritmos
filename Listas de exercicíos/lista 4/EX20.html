<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- 20. Análise de frequência do aluno

Crie um programa o qual: 

a) Solicita a frequência do aluno 

b) Ao clicar em "Analisar frequência", deve aparecer, abaixo dele: 

    A imagem de um turista, caso a frequência for menor que 50 OU 

    A imagem de um aluno estudioso, caso a frequência for a partir de 50 

 -->
    

 <span>Frequência do aluno</span>
 <input type="text" id="ipt_freq">

 <button onclick="exibir()">Analisar frequência</button>

 <div id="div_exibir"></div>

 

</body>
</html>

<script>

function exibir(){

let freq = Number(ipt_freq.value)

if(freq > 50){

div_exibir.innerHTML = (`<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSx_LivIrE-YcxChPgf2RDWaOpWKjU10FleQF2lD02BlA&s=10" alt="">`)


}else{

div_exibir.innerHTML = (`<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTq9kzA9IoEgAhRG4_BN2j8r280-skUP0RST7RGtoFbIQ&s=10" alt="">`)

}

}

</script>
