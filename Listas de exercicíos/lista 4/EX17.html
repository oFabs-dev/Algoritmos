<body>
     <!-- 17. Teste de divisibilidade

Crie um programa no qual:

a)      Receba dois números

b)     Tenha o botão “Testar”, verifique se o primeiro número é divisível pelo segundo número.
 OBS. Um número é divisível por outro quando o resto da divisão entre eles é zero.

c)      Se for divisível mostrar uma imagem com um “positivo”, caso contrário, mostrar uma imagem “negativo”.

  -->


  <span style="font-size: x-large;">Digite dois numeros:</span> 
   <input type="text" id="ipt_n1">
  <input type="text" id="ipt_n2">

  <button onclick="exibir()" style="font-size: x-large;">Testar</button>


    <div id="div_exibir"></div>

    
   

</body>
</html>

<script>

function exibir(){
let n1 = Number(ipt_n1.value)
let n2 = Number(ipt_n2.value)
let divisivel = n1 % n2

if( divisivel == 0){

    div_exibir.innerHTML =(`<img src="https://ak.picdn.net/contributors/498865/avatars/thumb.jpg?t=5955187">`)
}else{

    div_exibir.innerHTML =(`<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnYxJc-SlUdDgWtWYFDfJE9Y7N7Z7AES9EABHn9jJJNA&s=10" alt="negativo">`)
}


}

</script>
