<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <span>Nome:</span>
    <input type="text" id="input_nome">
    <br>
    <button onclick="alertar()">Cumprimentar alert</button>
    <button onclick="cumprimentar()">Cumprimentar innerHTML</button>
    <div id="div_mensagem"></div>


</body>
</html>

<script>

    let nome = input_nome.value

    function alertar(){
        alert(`Olá, ${nome}`)

    }

    function cumprimentar(){

       div_mensagem.innerHTML = `Olá, ${nome}`


    }
</script>
