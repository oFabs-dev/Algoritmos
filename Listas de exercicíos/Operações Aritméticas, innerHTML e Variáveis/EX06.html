<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX06</title>
</head>
<body>


<span>Cantidato A</span>
<input type="text" id="input_candA">

<span>Cantidato B</span>
<input type="text" id="input_candB">

<span>Branco</span>
<input type="text" id="input_branco">

<span>Nulo</span>
<input type="text" id="input_nulo">

<button onclick="exibir()">Resultado da Eleição</button>


<div id="div_exibir"></div>
    
</body>
</html>

<script>

    function exibir(){
    let candA = Number(input_candA.value)
    let candB = Number(input_candB.value)
    let branco = Number(input_branco.value)
    let nulo = Number(input_nulo.value)
    let soma = candA + candB + branco + nulo
    let inva = branco + nulo
    let porcenCANDA = (100 * candA) / soma
    let porcenCANDB = (100 * candB) / soma
    let porceniNVA = (100 * inva) / soma

    div_exibir.innerHTML = (`Total de votos: ${soma} <br> 

    Candidato A: ${porcenCANDA.toFixed(2)}% (${candA} votos) <br>

    Candidato B: ${porcenCANDB.toFixed(2)}% (${candB} votos) <br> 

    Inválidos: ${porceniNVA.toFixed(2)}% (${inva} votos) `)
    }

</script>
