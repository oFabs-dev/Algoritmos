<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 16. Treino de Musculação
Crie um programa o qual:

a) Pergunte de quantos em quantos dias o usuário faz musculação (é só uma informação, só 1 número, ok?)   

b) Ao clicar em "Exibir rotina mensal", mostre uma sequência de 30 frases, como neste exemplo:   

         Dia 1 - Musculação   

         Dia 2 - Comer, dormir etc   

         Dia 3 - Comer, dormir etc   

         Dia 4 - Musculação   

         Dia 5 - Comer, dormir etc   

         Dia 6 - Comer, dormir etc   

         Dia 7 - Musculação   

         ...   

         Dia 30 - Comer, dormir etc   

O Dia 1 sempre é de "Musculação"   

Considere que, nesse exemplo acima, o usuário informou 3 no item a)   
 -->

    <span>Quantos em quantos dias o usuário faz musculação </span>
    <input type="text" id="ipt_dias" />

    <button onclick="exibir()">Exibir rotina mensal</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let contar = 1;
    let dias = Number(ipt_dias.value);

    while (contar <= 30) {
      if (contar % dias == 1) {
        div_exibir.innerHTML += `Dia ${contar} - Musculação<br>`;
      } else {
        div_exibir.innerHTML += `Dia ${contar} - Comer, dormir etc<br>`;
      }

      contar++;
    }
  }
</script>
