<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 14. Divisibilidade  
Crie um programa o qual:

a) Solicite um intervalo crescente de valores numéricos

b) Solicite um número para teste de divisibilidade, ele tem que estar entre 3 e 13   

c) Ao clicar num botão "Divisível"...   

c) Exiba, debaixo do botão, todos os números contidos no intervalo do item a que NÃO são divisíveis pelo número do item b.

OBS: ao informar '1 a 10' no intervalo e informar '3' no divisor, deve exibir todos os números, exceto os múltiplos de 3 (como 3, 6 e 9). -->

    <span>Começo do intervalo</span>
    <input type="text" id="ipt_comeco" />

    <span>Fim do intervalo</span>
    <input type="text" id="ipt_fim" />

    <span>número para teste de divisibilidade(3 a 13)</span>
    <input type="text" id="ipt_divi" />

    <button onclick="divisivel()">Divisivel</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function divisivel() {
    let comeco = Number(ipt_comeco.value);
    let fim = Number(ipt_fim.value);
    let divisivel = Number(ipt_divi.value);

    if (divisivel < 3 || divisivel > 13) {
      alert(`ERROOO`);
    }

    while (comeco <= fim) {
      if (comeco % divisivel != 0) {
        div_exibir.innerHTML += `${comeco}<br>`;
      }

      comeco++;
    }
  }
</script>
