<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--  11. Tabuada Colorida
Crie um programa o qual:

a) Pergunte, numa input ou lista suspensa (select/option), qual a tabuada que o usuário quer ver na tela (2 a 9);  

b) Pergunte até que número a tabuada deve ser construída;  

c) Ao clicar no botão “Ver Tabuada”, exiba abaixo a tabuada como neste exemplo (considerando que o usuário escolheu a tabuada do 3 e para ir até o 12).  

    3 x 1 = 3   

    3 x 2 = 6   

    3 x 3 = 9   

    3 x 4 = 12   

    3 x 5 = 15   

    3 x 6 = 18   

    3 x 7 = 21   

    3 x 8 = 24   

    3 x 9 = 27   

    3 x 10 = 30   

    3 x 11 = 33   

    3 x 12 = 36   

d) Observar que quando o multiplicador for ímpar, a linha deve aparecer na cor vermelha e quando for par, na cor azul.

Ex: "3 x 1 = 3" aparecer em vermelho, mas "3 x 4 = 12" aparece em azul.   -->

    <span>Qual tabuada?</span>
    <select id="select_tabuada">
      <option disabled selected>Escolha uma tabuada</option>
      <option value="2">Tabuado do 2</option>
      <option value="3">Tabuado do 3</option>
      <option value="4">Tabuado do 4</option>
      <option value="5">Tabuado do 5</option>
      <option value="6">Tabuado do 6</option>
      <option value="7">Tabuado do 7</option>
      <option value="8">Tabuado do 8</option>
      <option value="9">Tabuado do 9</option>
    </select>

    <button onclick="exibir()">Ver Tabuada</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let contar = 0;
    let tabuada = Number(select_tabuada.value);

    div_exibir.innerHTML = ``;

    while (contar != 10) {
      contar++;
      div_exibir.innerHTML += `${contar} x ${tabuada} = ${contar * tabuada}<br>`;
    }
  }
</script>
