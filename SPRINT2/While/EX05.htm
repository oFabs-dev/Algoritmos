<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- 5. Corrida de Voltas
Crie um programa o qual:

a) Pergunte ao usuário quantas voltas um carro dará numa corrida   

b) Ao clicar num botão "Iniciar corrida!"...   

c) Até que o carro termine a corrida, exiba, debaixo do botão, frases como estas:   

       Carro dando a 1ª volta   

       Carro dando a 2ª volta   

       Carro dando a 3ª volta

       ...   (até a última volta informada pelo usuário)

d) Ao atingir o número de voltas informado, exiba, abaixo de tudo, a frase "Corrida finalizada!".

OBS: ao 'finalizar' as repetições das voltas, após o while, deve aparecer a mensagem. 
 -->

 <span>Quantas voltas um carro dará numa corrida</span>
 <input type="text" id="ipt_voltas">

 <button onclick="exibir()">Iniciar corrida!</button>

 <div id="div_exibir"></div>
</body>
</html>

<script>

function exibir(){
let voltas = ipt_voltas.value
let contar = 0

while(voltas != contar){
    contar ++
    div_exibir.innerHTML += `Carro dando a ${contar}ª volta <br>`
}


}
</script>
