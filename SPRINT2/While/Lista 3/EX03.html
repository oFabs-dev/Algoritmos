<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 20. Soma dos Pares
Crie  um programa o qual:

a) Solicite um número, que deve estar entre 10 e 500, exibindo alerta de erro caso não atenda os critérios;

b) Ao clicar no botão "Somar Pares", deve exibir todos os números pares entre 1 e o número inserido pelo usuário;

c) Ao final da listagem, deve exibir a frase "Soma dos pares: X", sendo X a soma de todos os números exibidos; -->

    <span>Numero</span>
    <input type="text" id="ipt_num" />

    <button onclick="pares()">Somar pares</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  let somaPares = 0;

  function pares() {
    let contar = 1;
    let num = Number(ipt_num.value);

    div_exibir.innerHTML = ``;

    if (num < 10 || num > 500) {
      alert("ERRO");
    }

    while (contar <= num) {
      if (contar % 2 == 0) {
        div_exibir.innerHTML += `${contar}<br> <br>`;
        somaPares += contar;
      }

      contar++;
    }

    div_exibir.innerHTML += `Soma dos pares: ${somaPares}`;
  }
</script>
