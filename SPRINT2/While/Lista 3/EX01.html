<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 18. Divisores
Crie  um programa o qual:

a) Receba um número do usuário, que deve estar entre 0 e 100;

b) Ao clicar no botão "Ver Divisores", deve exibir na tela, abaixo do botão, todos os divisores do número informado, 
como o exemplo abaixo, onde o usuário inseriu o número "10": 

     Divisores do Número 10:

     1

     2

     5

     10 -->

    <span>Numero</span>
    <input type="text" id="ipt_num" />

    <button onclick="divisores()">Ver Divisores</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function divisores() {
    let divisor = Number(ipt_num.value);
    let contar = 0;

    while (divisor >= contar) {
      contar++;

      if (divisor % contar == 0) {
        div_exibir.innerHTML += `${contar} <br> <br>`;
      }
    }
  }
</script>
