<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 10. Pares no Intervalo  
Crie um programa o qual:

a) Solicite um intervalo crescente de valores numéricos    

b) Ao clicar num botão "S2 Pares"...   

c) Exiba, debaixo do botão, todos os números pares contidos no intervalo.  
 -->

    <span>Intervalo crescente de valores numéricos </span>
    <input type="text" id="ipt_num" />

    <button onclick="exibir()">S2 Pares</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let contar = 0;
    let num = Number(ipt_num.value);

    while (contar != num) {
      contar++;

      if (contar % 2 == 0) div_exibir.innerHTML += `${contar}<br>`;
    }
  }
</script>
