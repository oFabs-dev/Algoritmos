<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05</title>
</head>
<body>
    <span>Insira o nome do filme que você gosta:</span>
    <input type="text" id="ipt_filme">
    <button onclick="cadastrarFilme()">Cadastrar Filme</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaFilme = [];
    function cadastrarFilme(){
        let filme = ipt_filme.value;

        listaFilme.push(filme);
        if(listaFilme.length < 3){
            div_exibir.innerHTML = ` 
                Seu filme favorito: ${listaFilme[0]}
                <br>
                Seu 3º filme favorito: Ainda não existe
                <br>
                Total de filmes cadastrados: ${listaFilme.length}
            `;
        } else {
            div_exibir.innerHTML = ` 
                Seu filme favorito: ${listaFilme[0]}
                <br>
                Seu 3º filme favorito: ${listaFilme[2]} 
                <br>
                Total de filmes cadastrados: ${listaFilme.length}
            `;
        }
    }
</script>
