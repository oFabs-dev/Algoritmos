<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 3. Relembrando Moradias: Onde Você Já Viveu?
Crie um programa o qual:
a) O usuário vá cadastrando os bairros onde morou; Ele digitará o nome do lugar em um campo e clicará em "Cadastrar bairro". 

b) Deve haver um outro campo, em que digita apenas um número, indicando o local onde morou, a partir do número 1 (porque os usuários comuns contam as coisas assim).

c) Após clicar em "Relembrar moradia", faça: 

c.1) Se ele informar "1", exiba o primeiro bairro cadastrado;
 Se informar "2", exiba o segundo bairro cadastrado e assim por diante ... 

c.2) Porém, ao informar um número maior do que a quantidade de bairros
 cadastrados, exiba: 

"Você ainda não morou num Xº bairro!"  -->

<span>Bairro onde morou:</span>
<input type="text" id="ipt_bairro">
<button onclick="add()">Cadastrar bairro</button>

<br><br>

<span>Número:</span>
<input type="number" id="ipt_numero" min="1">
<button onclick="relembrar()">Relembrar moradia</button>

<div id="div_exibir"></div>

</body>
</html>

<script>
let bairros = []

function add() {
    let bairro = ipt_bairro.value

    if (bairro == "") {
        div_exibir.innerHTML = "Digite o nome do bairro."
    }

    bairros.push(bairro)
}

function relembrar() {
    let numero = Number(ipt_numero.value)

     if (numero > bairros.length) {
        div_exibir.innerHTML = `Você ainda não morou num ${numero}º bairro!`
    } else {
        div_exibir.innerHTML = bairros[numero - 1]
    }
}

</script>
