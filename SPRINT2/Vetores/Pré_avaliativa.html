<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GASOLINA</title>
  </head>
  <body>
    <span>Combustivel</span>
    <select id="select_combu">
      <option value="6.49">GASOLINA</option>
      <option value="4.44">ETANOL</option>
      <option value="4.39">DIESEL</option>
    </select>

    <span>Quantidade vendida</span>
    <input type="text" id="ipt_qtdVend" />

    <span>Hora da venda</span>
    <input type="text" id="ipt_hora" />

    <button onclick="analisar()">Analisar</button>

    <button onclick="encerrar()">Encerrar dia</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  let ordem = 0;
  let acumuloRec = 0;
  let acumuloDes = 0;
  let acumuloEtanol = 0;
  let acumuloGasolina = 0;
  let acumuloDiesel = 0;

  function analisar() {
    let valor = Number(select_combu.value);
    let qtdVend = Number(ipt_qtdVend.value);
    let hora = Number(ipt_hora.value);
    ordem += 1;
    let recebido = qtdVend * valor
    acumuloRec += recebido;
    let desconto = 0;

    if (qtdVend >= 20 && (hora >= 21 || hora <= 6) && valor == 6.49) {
      desconto = valor * 0.0505;
      valor = valor - desconto;
      acumuloGasolina += qtdVend;
      
      acumuloDes += desconto;
    } else if(valor == 6.49){
      acumuloGasolina += qtdVend;
    }

    if (qtdVend >= 20 && (hora >= 21 || hora <= 6) && valor == 4.44) {
       desconto = valor * 0.048;
      valor = valor - desconto;
      acumuloEtanol += qtdVend;
      acumuloDes += desconto;
    }else if(valor == 4.44){
      acumuloEtanol += qtdVend;
    }

     if (qtdVend >= 20 && (hora >= 21 || hora <= 6) && valor == 4.39) {
     desconto = valor * 0.0303;
      valor = valor - desconto;
      acumuloDiesel += qtdVend;
      acumuloDes += desconto;
    } else if(valor == 4.39){
      acumuloDiesel += qtdVend;
    }

    div_exibir.innerHTML = `Venda ${ordem}ª – Valor Recebido = R$ ${recebido.toFixed(2)} – Desconto Concedido = R$ ${desconto.toFixed(2)} <br>
 – Acumulado dos Recebimentos= R$ ${acumuloRec.toFixed(2)} - <br>
  Acumulado dos Descontos = R$ ${acumuloDes.toFixed(2)}

 `;
  }

  function encerrar() {
    div_exibir.innerHTML = ` `;
    div_exibir.innerHTML = `Resumo do Faturamento <br>

Valor Total Recebido = R$ ${acumuloRec.toFixed(2)}<br>

Valor Total dos Descontos = R$ ${acumuloDes.toFixed(2)}<br>

 

Quantidade de Gasolina Vendida = ${acumuloGasolina.toFixed(2)} <br>

Quantidade de Etanol Vendida = ${acumuloEtanol.toFixed(2)} <br>

Quantidade de Diesel Vendida = ${acumuloDiesel.toFixed(2)}  `;
  }

  {
  }
</script>
