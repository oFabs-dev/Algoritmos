<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--5. Substituidor de Caracteres

Crie um programa o qual: 

a) Solicite uma senha ao usuário 

b) Enquanto ele digita, faça trocas para deixar a senha mais forte. Essas trocas são: 

    a ou A => @ 

    e ou E => 3 

 
c) Exiba o valor da senha mais forte logo abaixo, 
após as trocas (ou seja, o usuário vai vendo o novo valor na medida em que vai digitando) 

OBS: troque TODAS as ocorrências no texto, não só a primeira! Ex: rEAleza vira r3@l3z@, substituindo tanto "A"/"a" por @ e "E"/"e" por 3.
  -->

  <span>Senha:</span>
  <input type="text" id="ipt_senha" oninput="converter()">

  <div id="div_exibir"></div>
</body>
</html>

<script>
function converter(){
let senha = ipt_senha.value

  senha = senha.replaceAll('a', '@')
  senha = senha.replaceAll('A', '@')
  senha =  senha.replaceAll('e', '3')
  senha = senha.replaceAll('E', '3')

div_exibir.innerHTML = senha


}
</script>
