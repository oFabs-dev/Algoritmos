<!--   21. Análise de temperatura 

Crie um programa o qual: 

a) Solicita a temperatura do ambiente 

b) Ao clicar em "Verificar clima", determine se o clima está: 

    Apropriada p/ conservar alimento - Caso a temperatura for menor que 10 

    Inapropriada p/ conservar alimento - Caso a temperatura for a partir de 10 

c) Em caso de temperatura apropriada, exiba a figura de um alimento em bom estado. Caso contrário, exiba a imagem de um alimento estragado  -->


<span>Temperatura do ambiente</span>
<input type="text" id="ipt_temp">

<button onclick="exibir()">Verificar clima</button>

<div id="div_exibir"></div>

</body>
</html>

<script>


function exibir(){
let temp = Number(ipt_temp.value)

if(temp < 10){

div_exibir.innerHTML = (`<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRE0Y5g-UI02fKLadprENUeOmAeUuFmmCKEVdibMm5a_w&s=10" alt="">`)

}else{

div_exibir.innerHTML = (`<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGpSj0d1NvxFPFEuEBji3HWjeT3Mo4dKoAj6cgjPTf4A&s=10" alt="">`)
}


}    
</script>
