<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX02</title>
</head>
<body>

<span>Quantas latinha você toma no dia?</span>
<input type="number" id="inpt_refri">

<button onclick="exibir()">Quantos refris?</button>

<div id="div_exibir"></div>

    
</body>
</html>

<script>

function exibir(){
let QTDdia = Number(inpt_refri.value)
let QTDano = QTDdia * 365

if(QTDano >= 500){

div_exibir.innerHTML = (`Você consome ${QTDano} latinhas ao ano!!! <br>
CUIDADOO COM AS DIABETES`)

}else{

div_exibir.innerHTML = (`Você consome ${QTDano} latinhas ao ano!!!`)

}



}


</script>
