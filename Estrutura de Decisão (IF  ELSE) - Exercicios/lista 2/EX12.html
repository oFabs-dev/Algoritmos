<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX12</title>
  </head>
  <body>
    <span>Digite um numero</span>
    <input type="text" id="ipt_num" />

    <button onclick="exibir()">Multiplo de 5</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let num = Number(ipt_num.value);
    let num5 = num % 5;

    if (num5 < 0) {
      alert(`Digite um número maior que zero`);
    } else if (num5 == 0) {
      div_exibir.innerHTML = `Perfeito, esse número é múltiplo de cinco`;
    } else if (num5 == 1) {
      div_exibir.innerHTML = `Vich, sobrou um`;
    } else if (num5 == 2) {
      div_exibir.innerHTML = `Para esse o resto é dois`;
    } else if (num5 == 3) {
      div_exibir.innerHTML = `Com mais dois daria certo`;
    } else {
      div_exibir.innerHTML = `Só faltou 1 para ser múltiplo de 5`;
    }
  }
</script>
