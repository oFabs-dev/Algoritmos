<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX05</title>
  </head>
  <body>
    <span>Nota do aluno</span>
    <input type="text" id="ipt_nota" />
    <button onclick="exibir()">Classificar</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function exibir() {
    let nota = Number(ipt_nota.value);

    if(nota < 5){
        div_exibir.innerHTML = `Aluno precisa de muita ajuda`
    } else if( nota <= 7){
        div_exibir.innerHTML = `Aluno na média`
    } else if( nota <= 9.5){
        div_exibir.innerHTML = `Aluno na acima da média`
    }else{
        div_exibir.innerHTML = `Aluno fora da curva`
    }
  }
</script>
