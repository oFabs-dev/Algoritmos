<body>

    <!-- 16. Par ou Impar

Crie um programa no qual receba um número e quando o usuário clicar no botão “Analisar” emita uma das mensagens abaixo:

Se o número for par, emitir na cor vermelha com fundo amarelo “Esse número é PAR”

Se o número for impar, emitir cor azul e em negrito “Esse número é impar”  -->


<span>Digite um numero</span>
<input type="text" id="ipt_numero">

<button onclick="exibir()">Analisar</button>

<div id="div_exibir"></div>

    
</body>
</html>


<script>

function exibir(){
let valor = Number(ipt_numero.value)
let imparPar = valor % 2

if(imparPar == 0){
    div_exibir.innerHTML = (`<span style="color: red;background-color: yellow;">Esse número é PAR</span>`)
}else{
    div_exibir.innerHTML = (`<b style="color: blue;">Esse número é impar</b>`)
}


}

</script>
