<!doctype html>
<html lang="ptBR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAXI</title>
  </head>
  <body>
    <span>Distância percorrida</span>
    <input type="text" id="ipt_DistPerc" />

    <span>Velocidade média</span>
    <input type="text" id="ipt_Vm" />

    <button onclick="exibir()">Simular</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  let Inicial = 25;
  let PorcInicial = 100;

  function exibir() {
    let DistPerc = Number(ipt_DistPerc.value);
    let Vm = Number(ipt_Vm.value);
    let temp = DistPerc / Vm;
    let gastLitros = DistPerc / 10;
    let porcGast = (100 * gastLitros) / 25;
    PorcInicial -= porcGast;
    Inicial -= gastLitros;

    div_exibir.innerHTML += `Ao percorrer ${DistPerc}km, em velocidade média de ${Vm} km/h, a viagem durou ${temp.toFixed(2)} horas. Ao todo,
 foram gastos ${gastLitros} litros de combustível (${porcGast}%).Restam ${Inicial} litros de combustível (${PorcInicial}%)<br>`;

    if (PorcInicial > 30) {
      div_exibir.innerHTML += `Continue a rodar!<br>`;
    } else {
      div_exibir.innerHTML += `É melhor parar para reabastecer!<br>`;
    }
  }
</script>
