<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 9. Viva o 7!
Crie um programa o qual:

a) Receba um número (tem que estar entre 0 e 200);  

b) Ter um botão chamado "Viva o 7!"   

c) Ao clicar nesse botão, devem aparecer todos os múltiplos de 7 entre 0 e o número informado em a)

 -->

    <span>Numero(múltiplos de 7)</span>
    <input type="text" id="ipt_num" />

    <button onclick="viva()">Viva o 7!</button>

    <div id="div_exibir"></div>
  </body>
</html>

<script>
  function viva() {

    let num = Number(ipt_num.value);

  for (let i = 1;i <= num; i ++) {
      if(i % 7 == 0){

        div_exibir.innerHTML += `${i}<br>`;
      }
      
    }
  }
</script>
