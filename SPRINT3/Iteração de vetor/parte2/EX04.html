<body>

    <!-- 4. Cadastro de Alunos com Exibição Invertida
Crie um programa o qual:  
a) O usuário cadastre nomes de alunos;  

b) Porém, na medida que vai cadastrando, aparecem um abaixo do outro na ordem inversa em que foram cadastrados 
(ou seja, o último sempre fica no topo, o penúltimo em abaixo dele e assim por diante).   -->


NOME 
<input type="text" id="ipt_nome">

<button onclick="cadastrar()">Cadastrar</button>

<div id="div_exibir"></div>
</body>
</html>   

<script>


let ListaNomes = []

function cadastrar(){
    
div_exibir.innerHTML = ``
let nome = ipt_nome.value
ListaNomes.push(nome)


for(let i = ListaNomes.length - 1; i >= 0 ; i--){

    div_exibir.innerHTML += `${ListaNomes[i]} <br>`

}


}

</script>
