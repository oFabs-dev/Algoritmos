<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <!-- 1. Lista Viva de Filmes Favoritos
Crie um programa o qual:

a) O usuário informa os nomes dos filmes que mais gosta e clica em "Cadastrar"; 
b) Na medida em que vai cadastrando, os filmes vão aparecendo um abaixo do outro, abaixo do botão.  -->


nomes dos filmes que mais gosta
<input type="text" id="ipt_filme">

<button onclick="cadastrar()">Cadastrar</button>

<div id="div_exibir"></div>
</body>
</html>

<script>

function cadastrar(){
let filme = ipt_filme.value
let listaFilme = []
listaFilme.push(filme)

div_exibir.innerHTML +=  `${listaFilme[listaFilme.length - 1]} <br>`

}

</script>
